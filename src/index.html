<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
</head>
<body>
    <div class="mainContainer">
        <div id="bestAttempt">
            <h1>Best Attempt:</h1>
            <h4 id = "tries">Tries: </h4>
        </div>
        <input id ="guessInput" placeholder="Enter Guess">
        <div class="buttons">
            <div class="submitBtn">
                <button onclick="SubmitClick()">Submit</button>
            </div>
            <div class="revealBtn">
                <button onclick="RevealClick()">Reveal</button>
            </div>
        </div>
    </div>
    <p id="numbers">0-99 is valid</p>
 <script src="index.js"></script> 
</body>
</html>
