<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
</head>
<body>
    <div class="mainContainer">
        <div class="bestAttempt">
            <h1>Best Attempt:</h1>
        </div>
        <div id="validator">Guess: </div>
        <div class="guessInput">
            <input placeholder="Enter Guess">
        </div>
        <div class="buttons">
            <div class="submitBtn">
                <button>Submit</button>
            </div>
            <div class="revealBtn">
                <button>Reveal</button>
            </div>
        </div>
    </div>
</body>
</html>
